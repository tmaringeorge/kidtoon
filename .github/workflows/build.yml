name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: KidToon (Flutter, telefon + Android TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk KidToon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KidToon
          path: KidToon.apk

  release:
    name: Publică APK-ul
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KidToon
          path: apk
      - name: Actualizează release-ul "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: KidToon 1.0.${{ github.run_number }}
          prerelease: false
          make_latest: true
          body: |
            APK construit automat din `main` (commit ${{ github.sha }}).
            **KidToon.apk** merge și pe telefon, și pe televizor (Android TV / Google TV).
            Ghid de instalare: docs/INSTALARE-TV.md
          files: apk/KidToon.apk
